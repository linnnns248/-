<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>异地旅游用户外卖首页卡片 B</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f3f3f3;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      overflow-x: hidden;
    }

    .page-shell {
      width: min(750px, 100vw);
      max-width: 750px;
      min-height: 100vh;
      background: #ffffff;
    }

    .screen-image,
    .card-frame,
    .card-frame svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .card-frame {
      line-height: 0;
      position: relative;
      z-index: 1;
      margin-top: -8px;
      margin-bottom: -8px;
    }

    .bottom-tab-spacer {
      width: 100%;
      aspect-ratio: 750 / 155;
    }

    .bottom-tab-wrap {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(750px, 100vw);
      z-index: 20;
      background: #ffffff;
      pointer-events: none;
    }
  </style>
</head>

    <img class="screen-image" src="./橱窗切图.png" alt="橱窗切图">
